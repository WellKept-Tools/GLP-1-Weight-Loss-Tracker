    return `<button class="day ${css}" type="button" data-action="cal-select" data-value="${day}" aria-pressed="${day===date}" aria-label="${h(fmt(day,'long')+' · '+t('{count} events',{count:n(list.length,0)}))}"><span>${n(toDate(day).getDate(),0)}</span><span class="marks" aria-hidden="true">${list.slice(0,4).map(e=>`<span class="mark ${h(e.key||'')}"></span>`).join('')}</span></button>`;
  }).join('');
  const chosen=eventMap.get(date)||[];
  const listing=chosen.length?chosen.map(e=>`<div class="record"><div><h3 class="icon-label">${icon(e.key||'calendar')}${h(e.title)}</h3><p class="hint">${h(fmt(e.date))}${e.meta?' · '+h(e.meta):''}</p>${e.notes?`<p class="privacy-copy">${h(e.notes)}</p>`:''}</div>${interactive&&e.key&&e.key!=='reminders'?btn('Open','nav',e.key):''}</div>`).join(''):empty('No events on this date','calendar');
  return `${pageHead('calendar',actions)}<section class="card panel"><div class="chart-head"><h3>${h(fmt(date,mode==='month'?'month':'long'))}</h3>${interactive?segment([['month','Month'],['week','Week'],['day','Day']],'cal-mode',mode,'Calendar view'):''}</div><div class="actions">${btn('Previous','cal-step','-1')}${btn('Today','cal-select',today())}${btn('Next','cal-step','1')}</div><div class="calendar-grid ${mode==='day'?'daily':''}">${weekLabels}${dayCells}</div><div class="calendar-detail"><h3>${h(fmt(date,'long'))}</h3><div class="records">${listing}</div></div></section>`;
}
function profile(){
  const fs=[field('name','Display name'),select('lang','Language',langs.map((l,i)=>[l,langNames[i]])),select('theme','Appearance',[['light','Light'],['dark','Dark'],['system','System']]),select('weightUnit','Weight unit',['kg','lb'])];
  modal('My Profile',`<form id="profile-form">${fields(fs,state.prefs,'profile-')}<div class="actions form-actions">${btn('Settings','nav','settings','flat','settings')}<button class="btn primary" type="submit">${tx('Save')}</button></div></form>`);
  $('#profile-form').onsubmit=e=>{e.preventDefault();state.prefs=normalPrefs({...state.prefs,...formValues(e.currentTarget,fs)});save();applyPrefs();refreshChrome();closeModal();render();toast('Preferences saved.');};
}
function help(){
  return pageHead('help')+`<section class="card panel"><div class="brand-top">${logo('stack')}</div><h3>${tx('Getting started')}</h3><div class="stack"><p>${tx('Use the navigation or Quick add to open a tracker. Enter only the information you want to record.')}</p><p>${tx('Use the header controls to change language or appearance. Open Settings for more preferences.')}</p><p>${tx('The tracker works offline. Its records stay in this browser profile and may be lost if you clear browser data, move the file, or use private browsing. Local records are not encrypted by the tracker.')}</p>${helpEdition()}<p class="hint">WellKept Tools · ${tx(editionLabel())} · v1.0</p></div></section>${disclaimer()}`;
}
function quick(){modal('Quick add',`<div class="actions">${['weight','medication','hydration','nutrition','symptoms','mood',...quickExtra()].map(key=>btn(modules[key].add||navNames[key],'edit',key,'',key)).join('')}</div>`);}
function start(){
  setupEdition();state=load();applyPrefs();refreshChrome();ui.calendarDay=today();lastTickDay=today();
  pages.dashboard=dashboard;pages.help=help;render();
  const actions={
    nav:go, 'drawer-open':()=>drawer(true),'drawer-close':()=>drawer(false),'modal-close':closeModal,
    language:v=>pref('lang',v),theme:v=>pref('theme',v),quick,
    'dash-period':v=>{ui.period=v;refreshKeepingFocus();},
    'cal-select':v=>{ui.calendarDay=v;refreshKeepingFocus();},
    'cal-mode':v=>{ui.calendarMode=v;refreshKeepingFocus();},
    'cal-step':v=>{const d=toDate(ui.calendarDay);if(ui.calendarMode==='month')d.setMonth(d.getMonth()+Number(v),1);else d.setDate(d.getDate()+Number(v)*(ui.calendarMode==='week'?7:1));ui.calendarDay=localDate(d);refreshKeepingFocus();},
    edit:v=>{const [k,id]=v.split(':');edit(k,id);},
    delete:v=>{const [k,id]=v.split(':');confirmAction('Delete record','Delete this record?',()=>removeRow(k,id));},
    undo:(token,button)=>{const action=ui.undos.get(token);ui.undos.delete(token);if(action)action();button.closest('.toast')?.remove();},
    'mood-quick':moodQuick,
    ...handlers
  };
  document.addEventListener('click', event=>{
    const el=event.target.closest('[data-action]');
    if(el){tone();const action=actions[el.dataset.action];if(action){try{Promise.resolve(action(el.dataset.value||'',el,event)).catch(error=>sayRaw(error.message));}catch(error){sayRaw(error.message);}}}
    const point=event.target.closest('[data-tip]');if(point)tooltip(point,true);
  });
  document.addEventListener('change', e=>{const el=e.target;const command=el.dataset.change;if(command&&actions[command])Promise.resolve(actions[command](el.value,el,e)).catch(err=>sayRaw(err.message));});
  let debounce;
  document.addEventListener('input',e=>{
    const el=e.target;if(el.dataset.slider)$('output',el.closest('label')).textContent=el.value;
    const list=el.closest('[data-filter]');if(list){const key=list.dataset.filter;filter[key][el.name]=el.value;clearTimeout(debounce);debounce=setTimeout(()=>{const records=$('#record-list');if(ui.page===key&&records){records.innerHTML=recordList(key);afterRecordList(key,records);}},el.type==='search'?140:0);}
    onEditionInput(e);
  });
  document.addEventListener('pointerover',e=>{
    const point=e.target.closest('[data-tip]');if(point)tooltip(point,true);
    if(e.pointerType==='mouse'&&state.prefs.hover&&performance.now()-lastHover>350&&e.target.closest('.dashboard-card,button')!==e.relatedTarget?.closest?.('.dashboard-card,button')){lastHover=performance.now();tone('hover');}
  });
  document.addEventListener('pointerout',e=>{const p=e.target.closest('[data-tip]');if(p&&p!==e.relatedTarget?.closest?.('[data-tip]'))tooltip(p,false);});
  const scrubChart=e=>{
    if(e.pointerType!=='touch')return;
    const svg=e.target.closest('.chart-svg');if(!svg)return;
    const points=$$('[data-tip]',svg);if(!points.length)return;
    const local=svg.createSVGPoint();local.x=e.clientX;local.y=e.clientY;
    const transform=svg.getScreenCTM();if(!transform)return;
    const x=local.matrixTransform(transform.inverse()).x;
    const nearest=points.reduce((best,p)=>Math.abs(p.cx.baseVal.value-x)<Math.abs(best.cx.baseVal.value-x)?p:best);
    tooltip(nearest,true);
  };
  document.addEventListener('pointerdown',scrubChart,{passive:true});
  document.addEventListener('pointermove',scrubChart,{passive:true});
  document.addEventListener('focusin',e=>{if(e.target.dataset.tip)tooltip(e.target,true);});
  document.addEventListener('focusout',e=>{if(e.target.dataset.tip)tooltip(e.target,false);});
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&ui.drawer&&!$('#modal').open){drawer(false);e.preventDefault();}
    if(e.key==='Tab'&&ui.drawer&&!$('#modal').open){const focusables=$$('button,summary',$('#sidebar')).filter(b=>b.getClientRects().length);const first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){last?.focus();e.preventDefault();}else if(!e.shiftKey&&document.activeElement===last){first?.focus();e.preventDefault();}}
    if(e.target.dataset.tip){
      if(['Enter',' '].includes(e.key)){e.preventDefault();tooltip(e.target,true);}
      if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){
        e.preventDefault();const points=$$('[data-tip]',e.target.closest('.chart-svg')),i=points.indexOf(e.target);
        const next=e.key==='Home'?0:e.key==='End'?points.length-1:clamp(i+(e.key==='ArrowRight'?1:-1),0,points.length-1);
        e.target.setAttribute('tabindex','-1');points[next].setAttribute('tabindex','0');points[next].focus();
      }
    }
    if(e.altKey&&e.key.toLowerCase()==='a'&&!$('#modal').open){e.preventDefault();quick();}
  });
  $('#scrim').addEventListener('click',()=>drawer(false));
  $('#modal').addEventListener('close',()=>{if(!$('#modal').open&&dialogReturn?.isConnected)dialogReturn.focus();});
  localDark.addEventListener('change',()=>{if(state.prefs.theme==='system'){applyPrefs();syncThemeControls();}});
  compact.addEventListener('change',()=>drawer(false));
  document.addEventListener('visibilitychange',()=>{root.classList.toggle('page-hidden',document.hidden);if(!document.hidden)tick();});
  setInterval(()=>{if(document.hidden)return;const day=today();if(lastTickDay!==day){lastTickDay=day;if(!$('#modal').open)render();}tick();editionTick();},1000);
  afterStart();
}
function tooltip(point,show){
  const frame=point.closest('.chart-frame'),tip=$('.chart-tip',frame);if(!tip)return;
  tip.hidden=!show;
  $$('.hit.active',frame).forEach(el=>el.classList.remove('active'));
  if(show){tip.textContent=point.dataset.tip;point.classList.add('active');}
}

function demoHydration(){

function setupEdition(){

  modules.hydration.validate=row=>{if(row.date.slice(0,10)!==today())throw Error(t('The demo records hydration for today only.'));};

  pages.progress=()=>miniDemoPage('progress',`<h3>${tx('Weight Trend')}</h3>${weightChart(sampleRecords('weight'),{interactive:false})}`);

}
